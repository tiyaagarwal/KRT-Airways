<!DOCTYPE html>
<html>
<head>
    <title>KRT Airways - Select Seats</title>
    <link rel="stylesheet" href="seats.css">
    <script defer src="seats.js"></script>
</head>
<body>

<div class="navbar">
    <h2>✈️ KRT Airways</h2>
</div>

<h2>Select Your Seats 💺</h2>
<p id="info"></p>

<div class="legend">
    <span class="box available"></span> Available
    <span class="box selected"></span> Selected
    <span class="box booked"></span> Booked
</div>

<div class="seat-container" id="seats"></div>

<h3 id="count"></h3>

<button onclick="proceed()">Continue</button>

</body>
</html>
