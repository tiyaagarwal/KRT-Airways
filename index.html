<!DOCTYPE html>
<head>
    <title>KRT Airways - Login</title>
    <link rel="stylesheet" href="login.css">
    <script defer src="login.js"></script>
</head>
<body>

<div class="container">

    <div class="left-panel">
        <h1>✈️ KRT Airways</h1>
        <p>Fly Beyond Boundaries</p>
    </div>

    <div class="right-panel">

        <form id="loginForm">
            <h2>Sign In</h2>

            <div class="input-box">
                <label>Email</label>
                <input type="email" id="loginEmail" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="loginPassword" required>
            </div>

            <div class="extras">
                <label><input class="rememberMe" type="checkbox"> Remember Me</label>
                <span onclick="forgotPassword()">Forgot Password?</span>
            </div>

            <button type="submit">Login</button>

            <p class="switch">
                New user? <span onclick="goToSignup()">Create Account</span>
            </p>
        </form>

    </div>

</div>

</body>
</html>
